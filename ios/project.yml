name: GodsEyeIOS

options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    PRODUCT_BUNDLE_IDENTIFIER: com.amx150.godseye.ios
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

targets:
  GodsEyeIOS:
    type: application
    platform: iOS
    sources:
      - path: GodsEyeIOS
        excludes:
          - Resources
    resources:
      - path: GodsEyeIOS/Resources
    info:
      path: GodsEyeIOS/Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: GodsEye
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
